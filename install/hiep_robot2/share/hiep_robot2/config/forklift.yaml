# Fork-lift node. Geometry comes from the HMI robot profile (fork_length_m, fork_width_m,
# load_width_m, max_height_mm and the "fork" block with heights / insert depth ...).
forklift_node:
  ros__parameters:
    backend: sim                      # sim = built-in virtual fork | plc = Mega2560 PLC (/fork_hw_*)
    rate_hz: 20.0
    profile_file: ~/.agv_hmi/robot_profile.json
    state_file: ~/.agv_hmi/forklift_state.json   # remembers "carrying a load" across restarts
    odom_topic: /odom                 # use /wheel/odom on the real robot if /odom is the EKF output you do not want
    cmd_vel_topic: /cmd_vel           # goes through safety_monitor
    bypass_topic: /safety_bypass
    sim_speed_mm_s: 60.0
    sim_start_height_mm: 300.0
